<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HARMLESS — COMBAT VIEWER</title>
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/src/viewer/viewer.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="viewer-title">COMBAT VIEWER</div>
      <div id="viewer-hud"></div>
      <div id="viewer-controls">
        <!-- Deliberately empty: src/viewer/main.ts builds the rows from its own
             table, so a label and the weights under it cannot come apart. An
             <option> written here would be a second claim about which brain a
             row flies, and that is exactly how this page came to advertise a
             pack policy the game does not ship. -->
        <select id="scenario"></select>
        <button id="btn-restart">RESTART</button>
        <button id="btn-pause">PAUSE</button>
        <button id="btn-speed">SPEED 1x</button>
        <button id="btn-cam">CAM: ORBIT</button>
        <a id="viewer-other" href="/gallery">DESIGN GALLERY →</a>
      </div>
      <div id="scanlines"></div>
    </div>
    <script type="module" src="/src/viewer/main.ts"></script>
  </body>
</html>
