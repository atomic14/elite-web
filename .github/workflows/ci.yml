# CI: lint, test, build.
#
# Deployment is Cloudflare Pages, auto-deploying from this repo with build
# command `npm run build`. That command runs `prebuild` first (npm does this
# automatically), which runs lint + tests — so a broken commit fails the
# Cloudflare build and never reaches the live site. This workflow gives the
# same signal on pull requests, where Cloudflare's result isn't visible.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Run these separately from the build so a failure names itself in the
      # checks list, rather than hiding inside a generic "build failed".
      - name: Lint (strict type-check of src/, train/ and test/)
        run: npm run lint
      - name: Invariant + simulation tests
        run: npm test

      # The Elite-A alignment gate. Every assertion it runs is already inside
      # `npm test`, and the pack's hash-and-drift check is already inside
      # `npm run check` — so this is not extra coverage, it is a NAME. When the
      # vendored pack, the generated catalogue, the ship identities or the live
      # damage model drift apart, this check goes red and says which, instead of
      # a subsystem failure scrolling past inside a 1,700-line test run. Under a
      # second, so it is cheap to keep.
      - name: Elite-A alignment gate
        run: npm run elite-a

      # Repeats lint/test via prebuild — cheap, and proves the exact command
      # Cloudflare runs is green, which is what actually gates the deploy.
      - name: Build (as Cloudflare runs it)
        run: npm run build

      - name: Headless balance playtest
        run: npm run campaign
